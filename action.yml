name: Run Cypress tests
description: 'Runs Cypress tests via npm test'
branding:
  icon: 'fast-forward'
  color: 'purple'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Set default values for environment variables
      shell: bash
      run: |
        echo "WOPEE_SCREENSHOT_VALIDATION_ENABLED=${WOPEE_SCREENSHOT_VALIDATION_ENABLED:-true}" >> $GITHUB_ENV
        echo "WOPEE_COLLECT_PAGE_CONTENT=${WOPEE_COLLECT_PAGE_CONTENT:-true}" >> $GITHUB_ENV

    - name: Load client_payload.env → $GITHUB_ENV
      if: github.event.client_payload.env
      shell: bash
      run: |
        jq -r '
          .client_payload.env
          | to_entries[]
          | select(.value != null)
          | if (.value | type=="string" and test("\n"))
              then "\(.key)<<EOF\n\(.value)\nEOF"
              else "\(.key)=\(.value)"
            end
        ' "$GITHUB_EVENT_PATH" >> "$GITHUB_ENV"

    - name: Load .github/workflows/.env → $GITHUB_ENV
      shell: bash
      run: |
        if [ -f .github/workflows/.env ]; then
          # Extract valid KEY=VALUE lines; if none are found, skip without failing the step
          grep -vE '^(#|$)' .github/workflows/.env | \
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' \
            >> "$GITHUB_ENV" || true
        fi

    - name: Run tests
      shell: bash
      run: |
          npm install --prefer-offline --no-audit

          # Cypress 16 deprecates Electron, its default browser. The runner
          # image's `chrome` is Playwright's Chromium, a Chrome for Testing
          # build, which Cypress detects as `chrome-for-testing` from 13.17.0
          # on. WOPEE_CYPRESS_BROWSER picks another browser (`electron` keeps
          # the old one); the default is only used where it can run, and never
          # over a browser the project's own test script already picks.
          BROWSER="${WOPEE_CYPRESS_BROWSER:-}"
          if [ -z "$BROWSER" ]; then
            CYPRESS_VERSION=$(node -p "require('cypress/package.json').version" 2>/dev/null || true)
            if node -p "require('./package.json').scripts?.test ?? ''" 2>/dev/null | grep -q -- "--browser"; then
              echo "The test script picks its own browser."
            elif ! node -e 'const [major, minor] = process.argv[1].split(".").map(Number); process.exit(major > 13 || (major === 13 && minor >= 17) ? 0 : 1)' "$CYPRESS_VERSION"; then
              echo "::warning::Cypress ${CYPRESS_VERSION:-not found} cannot run Chrome for Testing (needs 13.17.0 or newer), running in Electron."
            elif ! chrome --version 2>/dev/null | grep -q "Google Chrome for Testing"; then
              echo "::warning::No Chrome for Testing on this runner, running in Electron."
            else
              BROWSER=chrome-for-testing
            fi
          fi

          if [ -n "$BROWSER" ]; then
            npm test -- --browser "$BROWSER"
          else
            npm test
          fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-results
        path: |
          cypress/videos
          cypress/screenshots
          cypress/results
          cypress/reports
          cypress/logs
        retention-days: 1